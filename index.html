<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #FFFDD0;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .result {
            font-size: 1.5em;
            font-weight: bold;
        }
        kbd {
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-center text-primary">100₱ Currency Converter</h1>
        <p class="text-center">Click the buttons below to convert 100 pesos to different currencies.</p>

        <div class="text-center">
            <button type="button" class="btn btn-success m-2" onclick="let php = 100; let yen = 0.0074; document.getElementById('display').innerHTML = '<kbd>' + (php * yen);">Yen</button>

            <button type="button" class="btn btn-warning m-2" onclick="let php = 100; let euro = 0.053; document.getElementById('display').innerHTML = '<kbd>' + (php * euro);">Euro</button>
        </div>

        <div class="text-center mt-4">
         <p class="result">Conversion result: <kbd id="display">₱100</kbd></p>
        </div>

        <div class="text-center mt-4">
            <a href="index.html">
                <button class="btn btn-success btn-lg">Refresh</button>
            </a>
        </div>
    </div>

</body>
</html>
